[project]
name = "bidpilot-backend"
version = "2.10.0"
description = "BidPilot AI backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "olefile>=0.47",
    "openai>=1.40",
    # 제안서 파일 업로드(멀티파트) — POST /api/auditor/run/upload
    "python-multipart>=0.0.9",
    # 제안서 초안 문서 내보내기 — GET /api/proposal/{id}/export
    "python-docx>=1.1",
    # 실적 원장 xlsx 읽기·쓰기 — ledger_import_service · performance_ledger.
    # 함수 안에서 지연 import 하므로 없어도 앱은 뜬다. 그래서 로컬에서는 오래 안 드러났고,
    # 서버에 깨끗이 설치했을 때 처음 드러났다(2026-09-10). 실제 런타임 의존성이다.
    "openpyxl>=3.1",
    # fastapi 가 끌고 오지만 app/core/auth.py 가 직접 import 한다. 전이 의존성에 기대지 않는다.
    "starlette>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
